<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a4fd6">
<title>Royal Colouring Book</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: slim top bar; picture in the middle; page picker and paint pots beside it (landscape) or above and below it (portrait) */
  --bg:#e9defc; --panel:#ffffff; --ink:#2b2540; --accent:#7a4fd6; --pop:#ff5fa2; --sun:#ffc93c;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#e9defc;background:var(--bg);color:#2b2540;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--pop);outline-offset:2px}
.app{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;padding:10px 16px}
.bar{flex:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:24px;font-weight:800;margin:0 12px 4px 0;line-height:1;color:var(--accent)}
#pname{font-size:19px;font-weight:600;flex:1 1 auto;margin:0 8px 4px 0;white-space:nowrap}
.tool{height:48px;padding:0 14px;margin:0 0 4px 8px;border-radius:16px;background:var(--panel);font-weight:800;font-size:16px;
  box-shadow:0 3px 0 rgba(43,37,64,.18)}
.tool:active{transform:translateY(2px)}
.tool.go{background:var(--accent);color:#fff}
.main{flex:1 1 0;min-height:0;display:flex;flex-direction:row}
.pages{flex:0 0 96px;overflow-y:auto;overflow-x:hidden;margin-right:10px}
.pg{display:block;width:88px;background:var(--panel);border-radius:12px;padding:3px;border:4px solid transparent;margin:0 0 6px;line-height:0}
.pg svg{width:100%;height:86px;display:block;pointer-events:none}
.pg[aria-pressed="true"]{border-color:var(--pop)}
.stage{flex:1 1 0;min-width:0;min-height:0;position:relative;background:var(--panel);border-radius:20px;overflow:hidden;
  box-shadow:0 4px 0 rgba(43,37,64,.15)}
#pic{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);display:block}
#pic .c{cursor:pointer}
.palette{flex:0 0 168px;margin-left:10px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start}
.sw{flex:0 0 auto;width:46px;height:46px;margin:4px;padding:0;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(43,37,64,.3)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 5px #2b2540;transform:scale(1.1)}
.spark{position:absolute;width:14px;height:14px;pointer-events:none;border-radius:50%;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.spark{display:none}}
@media (orientation:portrait){
  .main{flex-direction:column}
  .pages{flex:0 0 auto;display:flex;overflow-x:auto;overflow-y:hidden;margin:0 0 6px}
  .pg{flex:0 0 70px;width:70px;margin:0 6px 0 0}
  .pg svg{height:66px}
  .palette{flex:0 0 auto;margin:8px 0 0;overflow:visible;justify-content:center}
  .sw{width:calc(8.33vw - 11px);height:calc(8.33vw - 11px);max-width:62px;max-height:62px;margin:4px}
  h1{font-size:21px}
  #pname{display:none}
  .tool{font-size:15px;padding:0 11px}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Royal Colouring Book</h1>
    <div id="pname"></div>
    <button class="tool" id="undo" type="button">Undo</button>
    <button class="tool" id="clear" type="button">Start again</button>
    <button class="tool" id="sound" type="button">Sound: on</button>
    <button class="tool go" id="save" type="button" hidden>Save picture</button>
  </div>
  <div class="main">
    <div class="pages" id="pages" aria-label="Pictures"></div>
    <div class="stage" id="stage"><svg id="pic" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>
    <div class="palette" id="palette" aria-label="Colours"></div>
  </div>

const WRAP = (art) => `<g stroke="#2b2540" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="#ffffff">${art}</g>`;

const COLOURS = [
  ['Red','#ef3b3b'],['Coral','#ff7a6b'],['Orange','#ff8a1f'],['Gold','#f2b01e'],['Yellow','#ffd93b'],['Lime','#a6e04a'],
  ['Green','#2fae5b'],['Mint','#b8f0d0'],['Teal','#1fb5a8'],['Sky','#7fd3ff'],['Blue','#2f6fe0'],['Navy','#27358f'],
  ['Purple','#8a4fd6'],['Lilac','#cfa9f5'],['Pink','#ff9fc8'],['Hot pink','#ff3f96'],['Peach','#fde0c8'],['Tan','#e3b088'],
  ['Caramel','#b57a4c'],['Cocoa','#7a4a2a'],['Brown','#5a3a22'],['Grey','#9aa0ac'],['Black','#2b2540'],['White (rubber)','#ffffff']
];
const KEY = 'royal-colouring-v2';
let st = { page: 0, colour: '#ff3f96', sound: true, fills: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.fills) { st.page = s.page; st.colour = s.colour || st.colour; st.fills = s.fills; } } catch (e) {}
if (!(st.page >= 0 && st.page < PAGES.length)) st.page = 0;
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const pic = $('pic'), stage = $('stage');
const undoStack = {};
let shapes = [];

function fillsFor() { const id = PAGES[st.page].id; return st.fills[id] || (st.fills[id] = {}); }
function paint() { const f = fillsFor(); shapes.forEach((el, i) => el.setAttribute('fill', f[i] || '#ffffff')); }
function showPage(n) {
  st.page = n;
  pic.innerHTML = WRAP(PAGES[n].art);
  pic.setAttribute('aria-label', PAGES[n].name);
  shapes = Array.prototype.slice.call(pic.querySelectorAll('.c'));
  shapes.forEach((el, i) => el.setAttribute('data-i', i));
  $('pname').textContent = PAGES[n].name;
  Array.prototype.forEach.call(document.querySelectorAll('.pg'), (b, i) => b.setAttribute('aria-pressed', i === n));
  paint(); persist();
}

/* page picker */
PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'pg'; b.type = 'button'; b.setAttribute('aria-label', p.name);
  b.innerHTML = '<svg viewBox="0 0 600 700">' + WRAP(p.art) + '</svg>';
  b.addEventListener('click', () => { chime(); showPage(i); });
  $('pages').appendChild(b);
});

/* paint pots */
COLOURS.forEach((c) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.type = 'button'; b.style.background = c[1]; b.setAttribute('aria-label', c[0]);
  b.setAttribute('aria-pressed', c[1] === st.colour);
  b.addEventListener('click', () => {
    st.colour = c[1]; persist(); chime();
    Array.prototype.forEach.call(document.querySelectorAll('.sw'), (s) => s.setAttribute('aria-pressed', s === b));
  });
  $('palette').appendChild(b);
});

/* sound: the audio engine is created and woken inside a tap, which is what browsers require */
let actx = null, note = 0;
const SCALE = [523, 587, 659, 784, 880, 1047, 880, 784];
function wake() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; actx = new AC(); }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    return true;
  } catch (e) { return false; }
}
function tone(freq, when, len, vol) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len + 0.02);
}
function pop() { if (!st.sound || !wake()) return; try { const f = SCALE[note++ % SCALE.length]; tone(f, 0, 0.25, 0.45); tone(f * 1.5, 0.07, 0.3, 0.3); } catch (e) {} }
function chime() { if (!st.sound || !wake()) return; try { tone(988, 0, 0.12, 0.25); } catch (e) {} }
['touchend', 'mouseup', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, function unlock() { wake(); }, true));

function sparkle(x, y, colour) {
  const r = stage.getBoundingClientRect();
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span'), a = Math.random() * 6.28, d = 30 + Math.random() * 40;
    s.className = 'spark';
    s.style.cssText = 'left:' + (x - r.left - 7) + 'px;top:' + (y - r.top - 7) + 'px;background:' + (i % 2 ? colour : '#ffc93c') + ';--dx:' + Math.cos(a) * d + 'px;--dy:' + Math.sin(a) * d + 'px';
    stage.appendChild(s);
    setTimeout(() => { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
  }
}

/* colouring */
pic.addEventListener('click', (e) => {
  let el = e.target;
  while (el && el !== pic && !(el.getAttribute && /(^| )c( |$)/.test(el.getAttribute('class') || ''))) el = el.parentNode;
  if (!el || el === pic) return;
  const f = fillsFor(), i = el.getAttribute('data-i'), prev = f[i] || null;
  if ((prev || '#ffffff') === st.colour) return;
  const id = PAGES[st.page].id;
  (undoStack[id] = undoStack[id] || []).push({ i: i, prev: prev });
  if (st.colour === '#ffffff') delete f[i]; else f[i] = st.colour;
  el.setAttribute('fill', st.colour);
  pop(); sparkle(e.clientX, e.clientY, st.colour); persist();
});
$('undo').addEventListener('click', () => {
  const id = PAGES[st.page].id, u = (undoStack[id] || []).pop();
  if (!u) return;
  if (u.all) st.fills[id] = u.all;
  else { const f = fillsFor(); if (u.prev) f[u.i] = u.prev; else delete f[u.i]; }
  paint(); persist(); chime();
});
$('clear').addEventListener('click', () => {
  const id = PAGES[st.page].id;
  if (!Object.keys(fillsFor()).length) return;
  (undoStack[id] = undoStack[id] || []).push({ all: JSON.parse(JSON.stringify(fillsFor())) });
  st.fills[id] = {}; paint(); persist(); chime();
});
const soundLabel = () => { $('sound').textContent = st.sound ? 'Sound: on' : 'Sound: off'; };
$('sound').addEventListener('click', () => { st.sound = !st.sound; soundLabel(); pop(); });
soundLabel();

/* saving a PNG only works when the game runs as its own page (not inside a viewer frame) */
let framed = true; try { framed = window.self !== window.top; } catch (e) {}
if (!framed) {
  $('save').hidden = false;
  $('save').addEventListener('click', () => {
    const clone = pic.cloneNode(true);
    clone.setAttribute('width', 1200); clone.setAttribute('height', 1400);
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 1400;
      cv.getContext('2d').drawImage(img, 0, 0);
      cv.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = PAGES[st.page].id + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  });
}
showPage(st.page);
